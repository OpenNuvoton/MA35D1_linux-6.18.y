%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/nuvoton,ma35d1-dma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35 Series PDMA Controller

description: |
  The MA35D0, MA35D1, and MA35H0 SoCs provide four peripheral DMA controllers
  for memory-to-memory and peripheral data transfers. Each controller supports
  10 channels.

maintainers:
  - Shan-Chun Hung <schung@Nuvoton.com>

allOf:
  - $ref: dma-controller.yaml#

properties:
  compatible:
    enum:
      - nuvoton,ma35d0-dma
      - nuvoton,ma35d1-dma
      - nuvoton,ma35h0-dma

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  interrupts:
    maxItems: 1

  "#dma-cells":
    const: 1

  dma-channels:
    minimum: 1
    maximum: 10

additionalProperties: false

required:
  - compatible
  - reg
  - clocks
  - interrupts
  - "#dma-cells"
  - dma-channels

examples:
  - |
    #include <dt-bindings/clock/nuvoton,ma35d1-clk.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    pdma0: dma-controller@40080000 {
        compatible = "nuvoton,ma35d1-dma";
        reg = <0x40080000 0x2000>;
        interrupts = <GIC_SPI 18 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clk PDMA0_GATE>;
        #dma-cells = <1>;
        dma-channels = <10>;
    };
