%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/nuvoton,ma35d1-crypto-optee.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35D1 OP-TEE Cryptographic Accelerator

maintainers:
  - Nuvoton Technology Corporation <cwweng@nuvoton.com>

description:
  The Nuvoton MA35D1 OP-TEE cryptographic accelerator interface provides
  access to the hardware crypto engine through an OP-TEE Trusted Application.

properties:
  compatible:
    enum:
      - nuvoton,ma35d1-crypto-optee
      - nuvoton,ma35d0-crypto-optee
      - nuvoton,ma35h0-crypto-optee

required:
  - compatible

additionalProperties: false

examples:
  - |
    crypto-optee {
        compatible = "nuvoton,ma35d1-crypto-optee";
    };
...
