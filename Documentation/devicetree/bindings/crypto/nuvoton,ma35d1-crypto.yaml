%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/nuvoton,ma35d1-crypto.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35D1 Cryptographic Accelerator

maintainers:
  - Nuvoton Technology Corporation <cwweng@nuvoton.com>

description:
  The Nuvoton MA35D1 cryptographic accelerator provides hardware
  acceleration for AES, SHA, ECC, RSA and random number generation.

properties:
  compatible:
    enum:
      - nuvoton,ma35d1-crypto
      - nuvoton,ma35d0-crypto
      - nuvoton,ma35h0-crypto

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  rsa_ioctl:
    $ref: /schemas/types.yaml#/definitions/string
    enum:
      - "yes"
      - "no"
    description:
      Selects the vendor RSA ioctl interface when set to "yes".

  ecc_ioctl:
    $ref: /schemas/types.yaml#/definitions/string
    enum:
      - "yes"
      - "no"
    description:
      Selects the vendor ECC ioctl interface when set to "yes".

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    crypto: crypto@40300000 {
        compatible = "nuvoton,ma35d1-crypto";
        reg = <0x40300000 0x1000>;
        interrupts = <GIC_SPI 39 IRQ_TYPE_LEVEL_HIGH>;
        rsa_ioctl = "yes";
        ecc_ioctl = "yes";
    };
...
