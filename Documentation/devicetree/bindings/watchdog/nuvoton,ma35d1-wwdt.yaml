%YAML 1.2
---
$id: http://devicetree.org/schemas/watchdog/nuvoton,ma35d1-wwdt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35D1 Window Watchdog Timer

maintainers:
  - Nuvoton Technology Corporation <cwweng@nuvoton.com>

allOf:
  - $ref: watchdog.yaml#

properties:
  compatible:
    enum:
      - nuvoton,ma35d1-wwdt
      - nuvoton,ma35d0-wwdt
      - nuvoton,ma35h0-wwdt

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/clock/nuvoton,ma35d1-clk.h>
    soc {
        #address-cells = <2>;
        #size-cells = <2>;
        wwdt1: watchdog@40440100 {
          compatible = "nuvoton,ma35d1-wwdt";
          reg = <0x0 0x40440100 0x0 0x100>;
          interrupts = <GIC_SPI 44 IRQ_TYPE_LEVEL_HIGH>;
          clocks = <&clk WDT1_GATE>;
        };
    };
...
