%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/adc/nuvoton,ma35d1-eadc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35D1 Enhanced Analog to Digital Converter

maintainers:
  - Chi-Wen Weng <cwweng@nuvoton.com>

description: |
  The Nuvoton MA35D1 EADC is a 12-bit converter. The Linux 6.18
  driver describes enabled inputs with the eadc-channels property.

properties:
  compatible:
    const: nuvoton,ma35d1-eadc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: eadc_gate

  eadc-frequency:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: EADC clock frequency in Hz.

  eadc-channels:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 1
    maxItems: 8
    items:
      minimum: 0
      maximum: 7
    description: Enabled single-ended EADC channel numbers.

  eadc-diff-channels:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 2
    maxItems: 16
    items:
      minimum: 0
      maximum: 7
    description: Optional differential channel pairs (two values per pair).

  use_pdma:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]

  dmas:
    maxItems: 1

  dma-names:
    items:
      - const: rx

  pdma_reqsel_rx:
    $ref: /schemas/types.yaml#/definitions/uint32

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - eadc-frequency
  - eadc-channels

additionalProperties: false
