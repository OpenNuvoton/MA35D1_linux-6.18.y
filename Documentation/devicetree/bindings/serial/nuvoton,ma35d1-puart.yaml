%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/nuvoton,ma35d1-puart.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35D1 PDMA UART

maintainers:
  - Chi-Wen Weng <cwweng@nuvoton.com>

properties:
  compatible:
    const: nuvoton,ma35d1-puart

  reg:
    maxItems: 1

  port-number:
    $ref: /schemas/types.yaml#/definitions/uint32

  pdma-port:
    $ref: /schemas/types.yaml#/definitions/uint32

  pdma-tx-ch:
    $ref: /schemas/types.yaml#/definitions/uint32

  pdma-rx-ch:
    $ref: /schemas/types.yaml#/definitions/uint32

  interrupts:
    minItems: 2
    maxItems: 2

  interrupt-names:
    items:
      - const: puart_uart
      - const: puart_dma

  clocks:
    minItems: 2
    maxItems: 2

  clock-names:
    items:
      - const: puart_clk
      - const: pdma_clk

required:
  - compatible
  - reg
  - port-number
  - pdma-port
  - pdma-tx-ch
  - pdma-rx-ch
  - interrupts
  - interrupt-names
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    serial@40710000 {
        compatible = "nuvoton,ma35d1-puart";
        reg = <0x40710000 0x10000>;
        port-number = <1>;
        pdma-port = <0>;
        pdma-tx-ch = <0>;
        pdma-rx-ch = <1>;
        interrupts = <60>, <18>;
        interrupt-names = "puart_uart", "puart_dma";
        clocks = <&clk 1>, <&clk 2>;
        clock-names = "puart_clk", "pdma_clk";
    };
