%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/nuvoton,ma35d1.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35 Series I2S Controller

maintainers:
  - Chi-Wen Weng <cwweng@nuvoton.com>

description: |
  The Nuvoton MA35D0, MA35D1, and MA35H0 I2S controllers provide full-duplex serial audio
  interfaces for communicating with external audio codecs. They support
  I2S, left-justified, and right-justified formats, master and slave modes,
  and DMA-based playback and capture.

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    enum:
      - nuvoton,ma35d0-i2s
      - nuvoton,ma35d1-i2s
      - nuvoton,ma35h0-i2s

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  dmas:
    items:
      - description: DMA channel for audio playback
      - description: DMA channel for audio capture

  dma-names:
    items:
      - const: tx
      - const: rx

  pdma_reqsel_tx:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [86, 88]
    description:
      MA35 PDMA request-selection value for the I2S transmit request.

  pdma_reqsel_rx:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [87, 89]
    description:
      MA35 PDMA request-selection value for the I2S receive request.

  powerdown-gpios:
    maxItems: 1
    description:
      GPIO controlling the board audio power-down signal. The asserted
      state powers down the external audio path.

  '#sound-dai-cells':
    const: 0

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets
  - dmas
  - dma-names
  - pdma_reqsel_tx
  - pdma_reqsel_rx
  - '#sound-dai-cells'

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/nuvoton,ma35d1-clk.h>
    #include <dt-bindings/dma/nuvoton,ma35-pdma.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/reset/nuvoton,ma35d1-reset.h>

    i2s@40480000 {
        compatible = "nuvoton,ma35d1-i2s";
        reg = <0x40480000 0x10000>;
        interrupts = <GIC_SPI 70 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&clk I2S0_GATE>;
        resets = <&reset MA35D1_RESET_I2S0>;

        dmas = <&pdma2 0>, <&pdma2 1>;
        dma-names = "tx", "rx";

        pdma_reqsel_tx = <MA35_PDMA_REQ_I2S0_TX>;
        pdma_reqsel_rx = <MA35_PDMA_REQ_I2S0_RX>;

        #sound-dai-cells = <0>;
    };
