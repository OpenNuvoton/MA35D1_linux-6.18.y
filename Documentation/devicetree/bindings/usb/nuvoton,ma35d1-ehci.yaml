%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/nuvoton,ma35d1-ehci.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35D1 EHCI Controller

maintainers:
  - Nuvoton Technology Corporation <cwweng@nuvoton.com>

properties:
  compatible:
    enum:
      - nuvoton,ma35d1-ehci
      - nuvoton,ma35d0-ehci
      - nuvoton,ma35h0-ehci

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: hsusbh0_gate

  nuvoton,sys:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the system controller (SYS) registers.

  oc-active-level:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      Over-current detection active level.
      1: active-high
      0: active-low
    enum: [0, 1]

  nuvoton,rcalcode0:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Port 0 PHY internal resistor trim code.
    minimum: 0
    maximum: 15

  status: true

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - nuvoton,sys

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/nuvoton,ma35d1-clk.h>

    ehci0: ehci@40140000 {
        compatible = "nuvoton,ma35d1-ehci";
        reg = <0x0 0x40140000 0x0 0x1000>;
        clocks = <&clk HUSBH0_GATE>;
        clock-names = "hsusbh0_gate";
        nuvoton,sys = <&sys>;
        interrupts = <GIC_SPI 33 IRQ_TYPE_LEVEL_HIGH>;
        oc-active-level = <0>;    /* 1: active-high; 0: active low */
        nuvoton,rcalcode0 = <7>;  /* Port 0 PHY Internal Resistor Trim Code (0 ~ 15) */
    };
