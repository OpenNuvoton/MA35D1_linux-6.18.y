%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/nuvoton,ma35d1-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35D1 I2C Controller

maintainers:
  - Nuvoton Technology Corporation <cwweng@nuvoton.com>

description:
  The Nuvoton MA35D1 I2C controller supports controller and optional target mode.

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    enum:
      - nuvoton,ma35d1-i2c
      - nuvoton,ma35d0-i2c
      - nuvoton,ma35h0-i2c

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-frequency:
    description:
      Desired I2C bus clock frequency in Hz. The absence of this property
      indicates the default frequency 100 kHz.

  resets:
    maxItems: 1

  nuvoton,nfcnt:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 15
    default: 0
    description:
      Noise filter count field for CLKDIV[15:12]. This is a board-specific
      property that depends on PCB layout / bus noise conditions and should
      only be set (typically as a board-level override) on boards that
      require noise filtering. If omitted, the driver programs this field
      to 0.

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/nuvoton,ma35d1-clk.h>
    #include <dt-bindings/reset/nuvoton,ma35d1-reset.h>

    i2c0: i2c@40800000 {
      compatible = "nuvoton,ma35d1-i2c";
      reg = <0x40800000 0x1000>;
      interrupts = <GIC_SPI 13 IRQ_TYPE_LEVEL_HIGH>;
      clocks = <&clk I2C0_GATE>;
      clock-frequency = <100000>;
      resets = <&sys MA35D1_RESET_I2C0>;
      #address-cells = <1>;
      #size-cells = <0>;
    };
