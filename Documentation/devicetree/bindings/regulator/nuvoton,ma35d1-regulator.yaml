# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/nuvoton,ma35d1-regulator.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35D1/MA35D0/MA35H0 SoC voltage regulator

maintainers:
  - Your Name <your.email@example.com>

description: |
  This binding describes the regulator control interface for Nuvoton
  MA35D1, MA35D0, and MA35H0 platforms. The regulator is controlled
  through a platform-specific secure monitor call interface.

allOf:
  - $ref: /schemas/regulator/regulator.yaml#

properties:
  compatible:
    enum:
      - nuvoton,ma35d1-volt
      - nuvoton,ma35d0-volt
      - nuvoton,ma35h0-volt

required:
  - compatible

unevaluatedProperties: false

examples:
  - |
    regulator {
        compatible = "nuvoton,ma35d1-volt";
        regulator-name = "vdd-sd";
        regulator-min-microvolt = <1800000>;
        regulator-max-microvolt = <3300000>;
    };
...
