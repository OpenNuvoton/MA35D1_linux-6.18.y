%YAML 1.2
---
$id: http://devicetree.org/schemas/remoteproc/nuvoton,ma35d1-ampm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35D1 AMP-M rpmsg controller (hwsem-based IPI)

maintainers:
  - Joey Lu <yclu4@nuvoton.com>

description:
  The MA35D1 AMP-M driver provides an rpmsg communication channel between
  the Cortex-A35 Linux host and the Cortex-M4 remote core. Inter-processor
  interrupts are signalled through a pair of hardware spinlock (hwsem)
  channels. The A35 host acquires and immediately releases the TX hwsem
  entry to pulse the M4; the M4 does the same on the RX channel to signal
  the A35. The driver registers an IRQ on the hwsem interrupt line to
  receive inbound notifications.

  The shared memory layout is described by a resource table written by the
  M4 firmware into the reserved-memory region at boot. The driver
  periodically polls for the resource table to appear (500 ms delayed work)
  and parses vring offsets, buffer sizes, and channel naming space on first
  successful sync.

  Supported on MA35D1 only. For MA35D0 and MA35H0, use the timer-based
  AMP driver (nuvoton,ma35d0-amp or nuvoton,ma35h0-amp).

properties:
  compatible:
    const: nuvoton,ma35d1-ampm

  memory-region:
    maxItems: 1
    description:
      Phandle to a reserved-memory node shared between the A35 host and
      the M4 remote core. The M4 firmware writes a resource table at the
      start of this region describing vring layout and buffer sizes.

  rxipi:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: Phandle to the hwsem (hardware spinlock) controller.
          - description: >
              hwsem channel index used as the inbound IPI signal. The A35
              driver enables interrupts on this channel and waits for the
              M4 to acquire/release it as a notification pulse. Typically
              channel 6.
            minimum: 0
    description:
      Phandle with one argument (hwsem channel index) specifying the
      hardware spinlock entry used by the remote M4 core to signal the
      A35 host. Parsed with "#hwsem-cells" specifier.

  txipi:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: Phandle to the hwsem (hardware spinlock) controller.
          - description: >
              hwsem channel index used as the outbound IPI signal. The A35
              driver acquires and immediately releases this channel to pulse
              the M4 interrupt line. Typically channel 7.
            minimum: 0
    description:
      Phandle with one argument (hwsem channel index) specifying the
      hardware spinlock entry used by the A35 host to signal the remote
      M4 core. Parsed with "#hwsem-cells" specifier.

required:
  - compatible
  - memory-region
  - rxipi
  - txipi

additionalProperties: false

examples:
  - |
    ampm: ampm {
        compatible = "nuvoton,ma35d1-ampm";
        memory-region = <&rpmsg_buf>;
        rxipi = <&hwsem 6>;
        txipi = <&hwsem 7>;
    };
