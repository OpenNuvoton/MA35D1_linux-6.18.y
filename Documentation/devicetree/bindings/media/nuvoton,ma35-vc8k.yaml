%YAML 1.2
---
$id: http://devicetree.org/schemas/media/nuvoton,ma35-vc8k.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35 VC8000 Video Codec

maintainers:
  - Chi-Wen Weng <cwweng@nuvoton.com>

properties:
  compatible:
    enum:
      - nuvoton,ma35d0-vc8k
      - nuvoton,ma35d1-vc8k
      - nuvoton,ma35h0-vc8k
  reg:
    maxItems: 1
  clocks:
    maxItems: 1
  interrupts:
    maxItems: 1
  resets:
    maxItems: 1
  nuvoton,sys:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the MA35 system register syscon.
  memory-region:
    maxItems: 1
  pp_out_enable:
    enum: [yes, no]
  pp_wait_vsync:
    $ref: /schemas/types.yaml#/definitions/uint32
  debug_level:
    $ref: /schemas/types.yaml#/definitions/uint32
  fb_width:
    $ref: /schemas/types.yaml#/definitions/uint32
  fb_height:
    $ref: /schemas/types.yaml#/definitions/uint32
  fb_fmt:
    enum: [RGB888, RGB565, YUV420P]
  use_dev_coherent:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]

required:
  - compatible
  - reg
  - clocks
  - interrupts

additionalProperties: false
