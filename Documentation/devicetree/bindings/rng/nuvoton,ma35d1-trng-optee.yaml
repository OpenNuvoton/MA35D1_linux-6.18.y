$id: http://devicetree.org/schemas/rng/nuvoton,ma35d1-trng-optee.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35D1 OP-TEE True Random Number Generator

maintainers:
  - Nuvoton Technology Corporation <cwweng@nuvoton.com>

description:
  The Nuvoton MA35D1 OP-TEE TRNG provides access to the hardware
  random number generator through an OP-TEE Trusted Application.

properties:
  compatible:
    enum:
      - nuvoton,ma35d1-trng-optee
