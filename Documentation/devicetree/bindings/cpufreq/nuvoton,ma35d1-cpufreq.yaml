%YAML 1.2
---
$id: http://devicetree.org/schemas/cpufreq/nuvoton,ma35d1-cpufreq.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35D1 CPUFreq Driver

maintainers:
  - Nuvoton Technology Corporation <cwweng@nuvoton.com>

description: |
  CPU frequency scaling driver for the Nuvoton MA35D1 SoC.

  The driver controls CPU frequency through Secure Monitor Calls (SMC)
  and accesses the clock controller through the MA35D1 clock syscon.

properties:
  compatible:
    const: nuvoton,ma35d1-cpufreq

required:
  - compatible

additionalProperties: false

examples:
  - |
    cpufreq {
        compatible = "nuvoton,ma35d1-cpufreq";
    };

...

