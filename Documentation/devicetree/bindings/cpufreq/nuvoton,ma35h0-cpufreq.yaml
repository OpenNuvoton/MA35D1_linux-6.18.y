%YAML 1.2
---
$id: http://devicetree.org/schemas/cpufreq/nuvoton,ma35h0-cpufreq.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35H0 CPUFreq Driver

maintainers:
  - Nuvoton Technology Corporation <cwweng@nuvoton.com>

description: |
  CPU frequency scaling driver for the Nuvoton MA35H0 SoC.

  The driver controls CPU frequency through Secure Monitor Calls (SMC)
  and accesses the MA35H0 clock controller through syscon.

properties:
  compatible:
    const: nuvoton,ma35h0-cpufreq

required:
  - compatible

additionalProperties: false

examples:
  - |
    cpufreq {
        compatible = "nuvoton,ma35h0-cpufreq";
    };

...

