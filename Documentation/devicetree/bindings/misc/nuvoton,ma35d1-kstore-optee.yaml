%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/nuvoton,ma35d1-kstore-optee.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35D1 OP-TEE Key Store

maintainers:
  - Nuvoton Technology Corporation <cwweng@nuvoton.com>

description:
  The Nuvoton MA35D1 OP-TEE Key Store provides access to the hardware
  key storage engine through an OP-TEE Trusted Application.

properties:
  compatible:
    enum:
      - nuvoton,ma35d1-kstore-optee
      - nuvoton,ma35d0-kstore-optee
      - nuvoton,ma35h0-kstore-optee

required:
  - compatible

additionalProperties: false

examples:
  - |
    kstore-optee {
        compatible = "nuvoton,ma35d1-kstore-optee";
    };
...
