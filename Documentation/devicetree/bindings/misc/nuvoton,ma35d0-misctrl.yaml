%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/nuvoton,ma35d0-misctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35D0 Misc Control Driver

maintainers:
  - Nuvoton Technology Corporation <cwweng@nuvoton.com>

description:
  Miscellaneous control interface for the Nuvoton MA35D0 SoC. The driver
  provides a misc device for issuing MA35D0 SiP service calls.

properties:
  compatible:
    const: nuvoton,ma35d0-misctrl

required:
  - compatible

additionalProperties: false

examples:
  - |
    misctrl {
        compatible = "nuvoton,ma35d0-misctrl";
    };
...

