%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/nuvoton,ma35d1-ebi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35D1 EBI Controller

maintainers:
  - Nuvoton Technology Corporation <cwweng@nuvoton.com>

properties:
  compatible:
    enum:
      - nuvoton,ma35d1-ebi
      - nuvoton,ma35d0-ebi
      - nuvoton,ma35h0-ebi

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  bank:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1, 2]
    description: |
      The memory bank number (0 to 2) of this EBI node.

  busmode:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]
    description: |
      Address/Data Bus Separate Mode.
      0: Disabled
      1: Enabled

  csactiveLevel:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]
    description: |
      Chip Select Active Level.
      0: Active Low
      1: Active High

  datawidth:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 1]
    description: |
      Bus data width.
      0: 8-bit
      1: 16-bit

  MCLKDIV:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 7
    description: |
      External Output Clock Divider.
      Corresponds to bits [10:8] in register EBI_CTL0.

  tALE:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 7
    description: |
      Address Latch Enable (ALE) Hold Time.
      Corresponds to bits [18:16] in register EBI_CTL0.

  tACC:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 31
    description: |
      EBI Access Time.
      Corresponds to bits [7:3] in register EBI_TCTLx.

  tAHD:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 7
    description: |
      EBI Address Hold Time.
      Corresponds to bits [10:9] in register EBI_TCTLx.

  IDLE:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 15
    description: |
      Idle cycle.
      Corresponds to bits [27:24] and [15:12] in register EBI_TCTLx.

required:
  - compatible
  - reg
  - clocks
  - bank
  - busmode
  - csactiveLevel
  - datawidth
  - MCLKDIV
  - tALE
  - tACC
  - tAHD
  - IDLE

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/nuvoton,ma35d1-clk.h>

    ebi0: ebi@40100000 {
        compatible = "nuvoton,ma35d1-ebi";
        reg = <0x0 0x40100000 0x0 0x10>;
        bank = <0>;
        clocks = <&clk EBI_GATE>;
        busmode = <1>; /* Address/Data Bus Separate Mode. 0:Disabled, 1:Enabled */
        csactiveLevel = <0>; /* 0:Low, 1: High */
        datawidth = <1>; /* 0:8bit, 1: 16bit */
        MCLKDIV = <2>; /* 0 ~ 7,EBI_CTL0[10:8] */
        tALE = <1>; /* 0 ~ 7,EBI_CTL0[18:16] */
        tACC = <1>; /* 0 ~ 31, EBI_TCTLx[7:3] */
        tAHD = <1>; /* 0 ~ 7, EBI_TCTLx[10:9] */
        IDLE  = <3>; /* 0 ~ 15, EBI_TCTLx[27:24] and EBI_TCTLx[15:12] */
    };
