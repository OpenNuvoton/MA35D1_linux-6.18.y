%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/nuvoton,ma35d1-timer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35D1 Timer Controller

maintainers:
  - Nuvoton Technology Corporation <cwweng@nuvoton.com>

properties:
  compatible:
    enum:
      - nuvoton,ma35d1-timer
      - nuvoton,ma35d0-timer
      - nuvoton,ma35h0-timer

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  port-number:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: The hardware index/number of the timer port.
    enum: [0, 1, 2, 3, 4, 5]

  nuvoton,clk:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the main clock controller.

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - port-number
  - clocks

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/nuvoton,ma35d1-clk.h>

    timer0: timer0@40500000 {
        compatible = "nuvoton,ma35d1-timer";
        reg = <0x0 0x40500000 0x0 0x100>;
        interrupts = <GIC_SPI 47 IRQ_TYPE_LEVEL_HIGH>;
        port-number = <0>;
        nuvoton,clk = <&clk>;
        clocks = <&clk TMR0_GATE>;
    };
