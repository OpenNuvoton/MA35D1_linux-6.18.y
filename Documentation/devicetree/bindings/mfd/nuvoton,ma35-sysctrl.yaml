%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/nuvoton,ma35-sysctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35 System Register Protection Controller

maintainers:
  - Chi-Wen Weng <cwweng@nuvoton.com>

properties:
  compatible:
    enum:
      - nuvoton,ma35d0-sysctrl
      - nuvoton,ma35d1-sysctrl
      - nuvoton,ma35h0-sysctrl

  nuvoton,ma35d0-sys:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the corresponding MA35 system register syscon.

  nuvoton,ma35d1-sys:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the corresponding MA35 system register syscon.

  nuvoton,ma35h0-sys:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the corresponding MA35 system register syscon.

required:
  - compatible

allOf:
  - if:
      properties:
        compatible:
          const: nuvoton,ma35d0-sysctrl
    then:
      required: ["nuvoton,ma35d0-sys"]
  - if:
      properties:
        compatible:
          const: nuvoton,ma35d1-sysctrl
    then:
      required: ["nuvoton,ma35d1-sys"]
  - if:
      properties:
        compatible:
          const: nuvoton,ma35h0-sysctrl
    then:
      required: ["nuvoton,ma35h0-sys"]

additionalProperties: false

examples:
  - |
    sys-controller {
        compatible = "nuvoton,ma35d1-sysctrl";
        nuvoton,ma35d1-sys = <&sys>;
    };
