%YAML 1.2
---
$id: http://devicetree.org/schemas/rpmsg/nuvoton,ma35d1-rpmsg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nuvoton MA35D1 RPMsg Transport

maintainers:
  - Chi-Wen Weng <cwweng@nuvoton.com>

properties:
  compatible:
    const: nuvoton,ma35d1-rpmsg

  mboxes:
    maxItems: 1

  memory-region:
    maxItems: 1

required:
  - compatible
  - mboxes
  - memory-region

additionalProperties: false

examples:
  - |
    rpmsg {
        compatible = "nuvoton,ma35d1-rpmsg";
        mboxes = <&wormhole 2>;
        memory-region = <&rpmsg_buf>;
    };
